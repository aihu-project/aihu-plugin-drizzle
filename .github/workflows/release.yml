name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# npm trusted publishing authenticates this workflow with GitHub's OIDC token.
# There is deliberately no long-lived npm token or release secret in this file.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate exact stable tag
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::tag is not a stable semver: $TAG"; exit 1; }
          [[ "$TAG" == "$expected" ]] || { echo "::error::tag $TAG does not equal package version $expected"; exit 1; }
          [[ "$(git rev-parse "$TAG^{commit}")" == "$COMMIT" ]] || { echo "::error::tag does not point at the workflow commit"; exit 1; }
      - name: Build and test
        run: |
          npm run build
          npm run typecheck
          npm test
      - name: Confirm registry returns E404 only
        run: node scripts/assert-unpublished.mjs
      - name: Pack and validate tarball
        run: npm run verify:pack
      - name: Validate isolated consumer
        run: node scripts/consumer-smoke.mjs "$(find . -maxdepth 1 -name '*.tgz' -print -quit)"
      - name: Publish with OIDC provenance
        run: npm publish "$(find . -maxdepth 1 -name '*.tgz' -print -quit)" --access public --provenance
